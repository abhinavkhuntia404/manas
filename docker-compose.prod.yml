version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: manas_db_prod
    restart: always
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manas_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-manas}
    volumes:
      - manas_pgdata_prod:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manas} -d ${POSTGRES_DB:-manas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manas_internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: manas_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manas}:${POSTGRES_PASSWORD:-manas_secure_password_2026}@db:5432/${POSTGRES_DB:-manas}
      DATA_DIR: /app/data
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - manas_data_prod:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - manas_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.prod
    container_name: manas_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    networks:
      - manas_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  gateway:
    image: nginx:1.25-alpine
    container_name: manas_gateway_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - manas_internal

networks:
  manas_internal:
    driver: bridge

volumes:
  manas_pgdata_prod:
  manas_data_prod:
